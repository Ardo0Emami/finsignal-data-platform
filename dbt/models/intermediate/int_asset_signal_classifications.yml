version: 2

models:
  - name: int_asset_signal_classifications
    description: Asset-level historical regime and signal classifications derived from technical features.
    columns:
      - name: provider_name
        tests:
          - not_null
      - name: dataset_name
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: price_timestamp
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
      - name: close_price
        tests:
          - not_null
      - name: regime_label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - bullish_momentum
                  - bearish_momentum
                  - neutral
      - name: regime_explanation
        tests:
          - not_null
      - name: signal_label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - buy_watch
                  - risk_off
                  - hold_neutral
      - name: signal_explanation
        tests:
          - not_null
      - name: ingestion_run_id
        tests:
          - not_null
      - name: raw_path
        tests:
          - not_null
