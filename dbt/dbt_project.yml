name: finsignal
version: "1.0.0"
config-version: 2

profile: finsignal

model-paths:
  - models

seed-paths:
  - seeds

macro-paths:
  - macros

clean-targets:
  - target
  - dbt_packages

models:
  finsignal:
    staging:
      +schema: STAGING
      +materialized: view
    intermediate:
      +schema: INTERMEDIATE
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table


seeds:
  finsignal:
    +schema: MARTS
